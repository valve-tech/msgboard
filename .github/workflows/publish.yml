name: publish

# Publish stream: on a semver tag (vX.Y.Z), build and publish the public
# @msgboard/* packages whose version is not already on the npm registry.
#
# Authentication is OpenID Connect trusted publishing — NO long-lived npm token.
# GitHub mints a short-lived OpenID Connect token (requires the id-token: write
# permission below) and npm 11.5.1+ exchanges it for publish rights, provided each
# package has a matching trusted-publisher record on npmjs.com.
#
# Human prerequisites (one-time):
#   1. Because npm (unlike PyPI) cannot register a trusted publisher for a package
#      that does not yet exist, publish each @msgboard/* package once by hand from a
#      machine with an interactive `npm login` session (a browser session token, not
#      an automation token). This bootstrap publish carries no provenance; every
#      OpenID Connect publish afterward does.
#   2. On npmjs.com, add a GitHub Actions trusted publisher to EACH package
#      (npmjs.com/package/<name>/access). Fields must match this workflow exactly:
#        Organization or user: valve-tech
#        Repository:           msgboard
#        Workflow filename:    publish.yml   (filename only, no path)
#        Environment name:     (leave blank — this job declares no environment)
#        Allowed actions:      npm publish
# A mismatch on any field surfaces only as a generic 404 at publish time.

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # mint the OpenID Connect token npm exchanges for publish rights
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'

      # Node 24 already ships npm 11.x (trusted publishing needs 11.5.1+); this pins the
      # very latest to stay ahead of the floor. --force avoids a self-upgrade crash
      # ("Cannot find module 'promise-retry'").
      - run: npm install -g --force npm@latest

      - run: npm ci

      # pow-grinder is a Rust/WASM package. Install the toolchain so its WASM builds FROM SOURCE in CI —
      # its own prepublishOnly hook runs during `npm publish` below, so the published binary is built in
      # CI (real provenance), not shipped from a committed blob. We deliberately do NOT byte-compare the
      # result against the committed pkg/: wasm-pack/wasm-bindgen output is not reproducible across
      # toolchain versions, so a fresh CI build differs byte-for-byte from a local one while computing the
      # identical PoW (same Rust source). The committed pkg/ remains for local dev + the sdk parity tests.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-pack --locked

      # build the JS packages in dependency order (core <- sdk <- cosign <- petition <- history <- relayer);
      # hardhat ships its tsc output. history's tsc imports @msgboard/cosign AND @msgboard/petition, so both
      # must be built first (petition is built here only to satisfy history's build — it is not published in
      # this release's loop below). petition itself imports cosign + sdk, so it builds after them.
      - run: npm run build --workspace @msgboard/core
      - run: npm run build --workspace @msgboard/sdk
      - run: npm run build --workspace @msgboard/cosign
      - run: npm run build --workspace @msgboard/petition
      - run: npm run build --workspace @msgboard/history
      - run: (cd packages/hardhat && npx tsc)
      - run: npm run build --workspace @msgboard/relayer

      # No NODE_AUTH_TOKEN: authentication is OpenID Connect. Provenance is automatic.
      - name: Publish public @msgboard/* (idempotent)
        run: |
          # Dependency order (leaves first): core + pow-grinder before sdk (sdk depends on BOTH at
          # runtime), cosign before history (history depends on it), history before relayer. pow-grinder
          # rebuilds its WASM from source via its own prepublishOnly hook (the Rust toolchain is installed
          # above), so its published binary is built in CI — no --ignore-scripts.
          for entry in "@msgboard/core:packages/core" "@msgboard/pow-grinder:packages/pow-grinder" "@msgboard/sdk:packages/sdk" "@msgboard/cosign:packages/cosign" "@msgboard/history:packages/history" "@msgboard/hardhat:packages/hardhat" "@msgboard/relayer:packages/relayer"; do
            pkg="${entry%%:*}"
            dir="${entry##*:}"
            ver=$(node -p "require('./$dir/package.json').version")
            if npm view "$pkg@$ver" version >/dev/null 2>&1; then
              echo "$pkg@$ver already published, skipping"
            else
              echo "publishing $pkg@$ver"
              # Treat "cannot publish over previously published" as success in case the
              # registry read above lagged behind a recent bootstrap publish.
              npm publish --workspace "$pkg" --access public || {
                if npm view "$pkg@$ver" version >/dev/null 2>&1; then
                  echo "$pkg@$ver confirmed on registry after publish attempt, continuing"
                else
                  echo "$pkg@$ver publish failed and version not found on registry"
                  exit 1
                fi
              }
            fi
          done
