# Is our board alive?
#
# TWO QUESTIONS, AND ONLY ONE GATES THIS JOB.
#
# Alive is ours. An empty board means every writer is down or the node stopped
# accepting; it cannot be blamed on anyone else and we can fix it. That has actually
# happened — a proof-of-work cutover broke every writer on 2026-08-21, all three
# boards drained to zero inside their ~20 minute retention, and nobody noticed for
# eighteen days. This job catches that within the hour, which is why it runs hourly.
#
# Agreement with the wider network is REPORTED and never gated. Our PulseChain board
# shares nothing with rpc.pulsechain.com's, and we know why: that node runs erigon-pulse
# v2.4.1, which keeps the legacy proof of work. We cut over to the revised scheme on
# 2026-08-21, so each board rejects the other's messages. Their nodes also refuse
# msgboard_addMessage, so nobody writes across. The boards can converge only after the
# public PulseChain nodes ship a revised proof-of-work build. This job once gated on
# that finding and failed five times on day one, which is the mistake this comment
# exists to record.
#
# Replica-versus-replica disagreement DOES gate, but only where it can be measured.
# one.valve.city pins each API key to one upstream, so from GitHub we reach one of our
# replicas and cannot address the other. Set CONVERGENCE_<chain> to per-replica URLs
# and run it inside the fleet for that. The mainnet split of 2026-09-08, where two
# nodes held completely disjoint boards for weeks, is NOT visible from here.

name: board convergence

on:
  schedule:
    - cron: '41 * * * *'
  pull_request:
    paths:
      - 'packages/node-check/**'
  workflow_dispatch:

concurrency:
  group: board-convergence-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  convergence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - run: npm ci
      - run: npm run build --workspace @msgboard/node-check
      - run: npm run test --workspace @msgboard/node-check
      # Exit 1 when our board is partitioned, unreadable, or unverifiable.
      - run: node packages/node-check/dist/convergence-cli.js
