services:
  cast-watcher:
    image: node:24-alpine
    restart: unless-stopped
    working_dir: /app
    volumes: [ "./:/app" ]
    env_file: .env
    environment:
      CHAIN: "943"
      CONFIG: /app/943-deployment.json
      # keyed RPC for the chain reads/sends too — the public 943 RPC the default falls back to is flaky
      RPC: "https://one.valve.city/rpc/${VALVE_RPC_KEY}/evm/943"
      MSGBOARD_RPC: "https://one.valve.city/rpc/${VALVE_RPC_KEY}/evm/943"
    command: node cast-watcher.mjs
  player-bots:
    image: node:24-alpine
    restart: unless-stopped
    working_dir: /app
    volumes: [ "./:/app" ]
    env_file: .env
    environment:
      CHAIN: "943"
      CONFIG: /app/943-deployment.json
      RPC: "https://one.valve.city/rpc/${VALVE_RPC_KEY}/evm/943"
    command: node player-bots.mjs
  # FlipBook maker/taker pair: keeps the P2P offer book stocked on testnet and continuously
  # soak-tests post/take/reveal/claim/cancel (incl. a deterministic forfeit slice).
  flipbook-bots:
    image: node:24-alpine
    restart: unless-stopped
    working_dir: /app
    volumes: [ "./:/app" ]
    env_file: .env
    environment:
      CHAIN: "943"
      RPC: "https://one.valve.city/rpc/${VALVE_RPC_KEY}/evm/943"
      FLIPBOOK: "0xb009bd8b849dd33d9c5081ec6e53f29a947f6832"
      FLIPBOOK_DEPLOY_BLOCK: "24921235"
      # variant B: off-chain signed offers over x402PLS, sprayed + read on msgboard, taker driven
      # by WebSocket newHeads pushes (BOARD_WS defaults to the wss games proxy for the chain).
      FLIPBOOKX: "0x9e232e84E80FCaC3c78dE0820dABccf660511275"
      FLIPBOOKX_DEPLOY_BLOCK: "24932217"
      INTERVAL_MS: "180000"
      SELF_PLAY_INTERVAL_MS: "600000"
    command: node flipbook-bots.mjs
  # Continuously exercises the cosign.msgboard.xyz co-sign-over-board flow on 943: one
  # propose/cosign/threshold-reach session per hour. SAFE_943 + RELAY_URL are pinned by the
  # operator later — this actor is inert (no target Safe) until they're set on the box .env.
  cosign-bot:
    image: node:24-alpine
    restart: unless-stopped
    working_dir: /app
    volumes: [ "./:/app" ]
    env_file: .env
    environment:
      CHAIN: "943"
      RPC: "https://one.valve.city/rpc/${VALVE_RPC_KEY}/evm/943"
      INTERVAL_MS: "3600000"
      THRESHOLD: "2"
      COSIGN_INDICES: "40,41,42"
      # The deterministic fleet Safe (derived from the signer set — logged by the bot on first
      # boot) and the live gasless-deploy relay. Both public config, so they live here, not .env.
      SAFE_943: "0x67D4FBA30DFeFb1AA2d199c33e239dc6BCAfF705"
      RELAY_URL: "https://cosign.msgboard.xyz/relay"
    command: node cosign-bot.mjs
  # Off-chain session tables: keeps every @msgboard/games table alive on 943 — all 16 single-draw
  # games (dice/limbo/plinko/keno/crash/pachinko/wheel/monte/dicex2/baccarat/dragonTiger/andarBahar/
  # cascade/roulette + wordle), all 7 ladder games (towers/chicken/firewalk/heist/hilo/greedDice/
  # cipher), the decision card games (blackjack/threeCardPoker/videoPoker/paiGow), stateful mines,
  # the sudoku solver, and the two-peer hilo-war ZK duel. In-process HouseSession co-sign (no on-chain
  # tx, no funded key — just MNEMONIC at addressIndex 30). BOARD_FEED is off by default; set it to "1"
  # once the WASM grinder is wired into the bundle to light up the games.msgboard.xyz:lobby:943 feed.
  session-bots:
    image: node:24-alpine
    restart: unless-stopped
    working_dir: /app
    volumes: [ "./:/app" ]
    env_file: .env
    environment:
      CHAIN: "943"
      CONFIG: /app/943-deployment.json
      RPC: "https://one.valve.city/rpc/${VALVE_RPC_KEY}/evm/943"
      # Lobby feed ON: pow-worker stamps via the portable WASM grinder (base64-embedded in the
      # bundle, no native addon), so table open/summary notices post to games.msgboard.xyz:lobby:943.
      # BOARD_RPC resolves from VALVE_RPC_KEY (.env). Posts are best-effort + serialized (drop-if-busy).
      BOARD_FEED: "1"
    command: node session-bots.mjs
  # The landing coin-flip HOUSE: the live counterparty the msgboard.xyz landing Arcade plays against.
  # Zero-stakes optimistic (settlementMode 0) provably-fair 2× coin flip over the board-mediated
  # commit-reveal protocol — nothing ever settles on-chain. The house key SIGNS only (mnemonic
  # addressIndex 50, clear of validators 1-3 / gate players 4-8 / session-bots 30 / cosign-bot 40-42),
  # so it needs NO funds. Serves the isolated landing feed on games.msgboard.xyz:landing:943. The
  # derived house address is logged in the startup banner (pin it as the landing house in the UI).
  landing-house:
    image: node:24-alpine
    restart: unless-stopped
    working_dir: /app
    volumes: [ "./:/app" ]
    env_file: .env
    environment:
      CHAIN: "943"
      RPC: "https://one.valve.city/rpc/${VALVE_RPC_KEY}/evm/943"
      MSGBOARD_RPC: "https://one.valve.city/rpc/${VALVE_RPC_KEY}/evm/943"
      HOUSE_INDEX: "50"
    command: node landing-house.mjs
  # Same landing coin-flip house on 369 (the msgboard.xyz landing page defaults to PulseChain mainnet):
  # same mnemonic index 50 → the SAME signing address (index derivation is chain-independent), so the
  # UI's single pinned VITE_LANDING_HOUSE_ADDRESS matches on either chain. Signs only, no funds, zero
  # stakes/optimistic — never calls a contract, so the 943 HouseChannel domain anchor is fine here too.
  landing-house-369:
    image: node:24-alpine
    restart: unless-stopped
    working_dir: /app
    volumes: [ "./:/app" ]
    env_file: .env
    environment:
      CHAIN: "369"
      RPC: "https://one.valve.city/rpc/${VALVE_RPC_KEY}/evm/369"
      MSGBOARD_RPC: "https://one.valve.city/rpc/${VALVE_RPC_KEY}/evm/369"
      HOUSE_INDEX: "50"
    command: node landing-house.mjs
  # The fun-chips FAUCET: watches games.msgboard.xyz:chipsplease:943 and owner-mints Chips to the
  # posted recipient address (one PoW post = one grant, dedup by message hash). The faucet key
  # (mnemonic index 51) is the Chips owner and needs 943 GAS (minting is on-chain). Posts nothing.
  chip-faucet:
    image: node:24-alpine
    restart: unless-stopped
    working_dir: /app
    volumes: [ "./:/app" ]
    env_file: .env
    environment:
      CHAIN: "943"
      RPC: "https://one.valve.city/rpc/${VALVE_RPC_KEY}/evm/943"
      CHIPS: "0x81f130c7d9ff020f46f3b01918424173f8d5ca64"
      FAUCET_INDEX: "51"
      CHIP_CATEGORY: "chipsplease:943"
    command: node chip-faucet.mjs
  cast-watcher-369:
    image: node:24-alpine
    restart: unless-stopped
    working_dir: /app
    volumes: [ "./:/app" ]
    env_file: .env
    environment:
      CHAIN: "369"
      CONFIG: /app/369-deployment.json
      INTERVAL_MS: "30000"
      VAULT_FLOOR: "5000"
      RPC: "https://one.valve.city/rpc/${VALVE_RPC_KEY}/evm/369"
      MSGBOARD_RPC: "https://one.valve.city/rpc/${VALVE_RPC_KEY}/evm/369"
    command: node cast-watcher.mjs
  # The petition BOT: seeds + drives the @msgboard/petition capture->settle loop on chain 943 — ensures
  # each configured statement exists as a petition (idempotent, deterministic per-statement id), has
  # SIGNER_COUNT mnemonic-indexed keys co-sign it, then submitBatch()s the outstanding (verified but
  # not-yet-on-chain) signatures on a timer. Indices 60/61-65 are a fresh block, clear of validators 1-3,
  # gate players 4-8, ops 10-11, player-bots 20-29, flipbook/session-bots 30-31, cosign-bot 40-42,
  # landing-house 50, chip-faucet 51 — CREATOR_INDEX (60) needs its own 943 gas top-up (no auto-refill
  # wired here, unlike chip-faucet's FUNDER_INDEX 0 mechanism).
  # PETITION_VERIFIER is the deployed PetitionSignatures address (games/contracts/scripts/deploy-petition.ts) —
  # TODO(deploy-time): unset until then. Empty -> the bot runs capture-only (ensures petitions exist on
  # the board) and logs a loud warning; it never signs/settles against a placeholder domain (signatures
  # are EIP-712 domain-bound to the verifier — see petition-bot.ts's own guard).
  # PETITION_STATEMENTS is a TODO(deploy-time) JSON array of statement strings to seed, e.g.
  # '["Free the whales"]' — empty array is inert (logs a warning, nothing to seed).
  petition-bot:
    image: node:24-alpine
    restart: unless-stopped
    working_dir: /app
    volumes: [ "./:/app" ]
    env_file: .env
    environment:
      CHAIN: "943"
      RPC: "https://one.valve.city/rpc/${VALVE_RPC_KEY}/evm/943"
      PETITION_VERIFIER: "${PETITION_VERIFIER:-}"
      PETITION_STATEMENTS: "${PETITION_STATEMENTS:-[]}"
      CREATOR_INDEX: "60"
      SIGNER_START_INDEX: "61"
      SIGNER_COUNT: "5"
      SETTLE_INTERVAL_MS: "300000"
    command: node petition-bot.mjs
  # Player-run CoinFlipTables bots on 943: an operator (mnemonic index 70) runs one open table; the
  # players (71..) open rounds against it in CHIPS, and the separate cast-watcher settles each round.
  # This is the ONLY actor that plays CoinFlipTables — it exists to surface real table + shared-pool
  # settlement/refund/bankroll bugs instead of us only theorizing. FUNDING: gas auto-tops from index 0;
  # Chips are NOT minted here — they CIRCULATE within the fleet (win pays the player, loss funds the hot,
  # operator withdrawHot()s to redistribute). SEED once by sending Chips to the operator address (logged
  # on boot); until then the bot PAUSES all Chips spend and logs the exact seed request. Modest cadence:
  # it heats the SHARED validator ladder (CoinFlip/Raffle/CoinFlipTables), so the hardened cast-watcher's
  # drift-detect is the safety net for the extra open concurrency.
  table-bots:
    image: node:24-alpine
    restart: unless-stopped
    working_dir: /app
    volumes: [ "./:/app" ]
    env_file: .env
    environment:
      CHAIN: "943"
      CONFIG: /app/943-deployment.json
      RPC: "https://one.valve.city/rpc/${VALVE_RPC_KEY}/evm/943"
      OP_INDEX: "70"
      PLAYER_INDEX_BASE: "71"
      PLAYERS: "3"
      INTERVAL_MS: "120000"
    command: node table-bots.mjs
  player-bots-369:
    image: node:24-alpine
    restart: unless-stopped
    working_dir: /app
    volumes: [ "./:/app" ]
    env_file: .env
    environment:
      CHAIN: "369"
      CONFIG: /app/369-deployment.json
      INTERVAL_MS: "900000"
      SELF_PLAY_INTERVAL_MS: "21600000"
      VAULT_FLOOR: "5000"
      MAX_STAKE: "25"
      # 369-sized floats (mainnet gas ~4e5 gwei): the pre-flight envelope for a 4M-gas enter is
      # ~3.5k PLS, so the cushion covers one envelope and the top-up band sits above cushion+stake.
      # The 200-PLS testnet default wedged the bots at nonce 0 from first boot (2026-07-21).
      GAS_CUSHION: "4000"
      TOP_UP_BELOW: "4500"
      TOP_UP_TO: "8000"
      RPC: "https://one.valve.city/rpc/${VALVE_RPC_KEY}/evm/369"
    command: node player-bots.mjs
