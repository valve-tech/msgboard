---
# Deploy the msgboard.xyz UI: rsync THIS repo's packages/ui source to the box, then rebuild the `ui`
# compose service (root-context Dockerfile → vite build → `vite preview` on :4173 behind Caddy).
# Mirrors the proven manual procedure; only packages/ui syncs — the rest of /opt/msgboard is owned
# by its own deploys, and the docker build reuses the tree already on the box for everything else.
#
#   ansible-playbook deploy-msgboard-ui.yml
- name: Deploy the msgboard.xyz UI (source rsync + docker rebuild)
  hosts: msgboard
  gather_facts: false
  vars:
    repo_root: "{{ playbook_dir }}/.."
    deploy_dir: /opt/msgboard
  tasks:
    - name: Rsync packages/ui source (exclude build outputs)
      ansible.posix.synchronize:
        src: "{{ repo_root }}/packages/ui/"
        dest: "{{ deploy_dir }}/packages/ui/"
        delete: true
        use_ssh_args: true
        rsync_opts:
          - "--exclude=node_modules"
          - "--exclude=dist"
      register: ui_sync

    # The landing Arcade lazy-loads @msgboard/games (games/msgboard-games) + @msgboard/settle
    # (games/msgboard-settle). Their remaining deps (@msgboard/pow-grinder, @msgboard/sdk) already live
    # in packages/ on the box, and neither games package has an install script — so ship ONLY those two
    # workspaces (source; no hardhat/zk/contracts weight) and register them in the box's otherwise
    # packages-only root workspaces so `npm i` in the docker build links them. Ships coinflip (gameId 5)
    # + landingHouseCategory that the UI imports.
    - name: Ensure the games/ parent dir exists (the box is otherwise a packages-only snapshot)
      ansible.builtin.file:
        path: "{{ deploy_dir }}/games"
        state: directory
        mode: "0755"

    - name: Rsync the two games workspaces the UI build needs (source only)
      ansible.posix.synchronize:
        src: "{{ repo_root }}/games/{{ item }}/"
        dest: "{{ deploy_dir }}/games/{{ item }}/"
        delete: true
        use_ssh_args: true
        rsync_opts:
          - "--exclude=node_modules"
          - "--exclude=dist"
      loop: [msgboard-games, msgboard-settle, house-service]
      register: games_sync

    - name: Register those workspaces in the box root package.json (idempotent, python3 — no host node)
      ansible.builtin.shell: |
        cd {{ deploy_dir }}
        python3 - <<'PY'
        import json
        p = json.load(open('package.json'))
        ws = p.get('workspaces', [])
        add = [w for w in ('games/msgboard-games', 'games/msgboard-settle', 'games/house-service') if w not in ws]
        if add:
            p['workspaces'] = ws + add
            json.dump(p, open('package.json', 'w'), indent=2)
            open('package.json', 'a').write('\n')
            print('ADDED ' + ', '.join(add))
        PY
      register: ws_patch
      changed_when: "'ADDED' in ws_patch.stdout"

    # The box's package-lock.json predates these workspaces (it's a packages-only snapshot), so `npm i`
    # in the image would resolve @msgboard/games et al. from the stale lock → registry 404. Drop it so
    # `npm i` regenerates from the patched package.json and links all workspaces. Regenerable; the box's
    # root Dockerfile uses `npm i` (not `npm ci`), so no reproducibility guarantee is being relied on.
    - name: Drop the stale root package-lock.json so npm i resolves the new workspaces fresh
      ansible.builtin.file:
        path: "{{ deploy_dir }}/package-lock.json"
        state: absent

    # The box's root Dockerfile is a packages-only version (no `COPY games games`), so the image never
    # got the engine source → npm i 404'd on @msgboard/games. Ship the updated Dockerfile (it now COPYs
    # games/ + declares the VITE_LANDING_HOUSE_ADDRESS build arg). Shared with the sponsor build, where
    # `COPY games games` is harmless (the 3 light workspaces, no install scripts).
    - name: Ship the updated root Dockerfile (COPY games + VITE_LANDING_HOUSE_ADDRESS arg)
      ansible.builtin.copy:
        src: "{{ repo_root }}/Dockerfile"
        dest: "{{ deploy_dir }}/Dockerfile"
        mode: "0644"

    # Targeted (not a whole-file overwrite, to avoid clobbering box-specific config for other services):
    # ensure the ui service passes the pinned house address to the build. Reads VITE_LANDING_HOUSE_ADDRESS
    # from the box .env (set separately). Absent → the arg is empty → the UI's pinned checks fall back.
    - name: Ensure the ui build passes VITE_LANDING_HOUSE_ADDRESS (idempotent compose arg)
      ansible.builtin.lineinfile:
        path: "{{ deploy_dir }}/docker-compose.prod.yml"
        line: "        VITE_LANDING_HOUSE_ADDRESS: ${VITE_LANDING_HOUSE_ADDRESS:-}"
        insertafter: "VITE_RPC_943:"
        firstmatch: true

    # The root build script `npm run build --workspace=*` shell-globs `*` against /app, which after
    # `npm i` includes node_modules + package.json + the new games/ dir → `npm run build
    # --workspace=node_modules …` → npm errors on the non-workspace entries. Replace it with npm's
    # proper all-workspaces flag (no shell glob, skips workspaces without a build script). Idempotent;
    # strictly more correct for the shared ui+sponsor builds. python3 (no host node).
    - name: Make the root build script glob-proof (npm run build --workspaces --if-present)
      ansible.builtin.shell: |
        cd {{ deploy_dir }}
        python3 - <<'PY'
        import json
        p = json.load(open('package.json'))
        want = 'npm run build --workspaces --if-present'
        if p.get('scripts', {}).get('build') != want:
            p.setdefault('scripts', {})['build'] = want
            json.dump(p, open('package.json', 'w'), indent=2)
            open('package.json', 'a').write('\n')
            print('PATCHED')
        PY
      register: build_script_patch
      changed_when: "'PATCHED' in build_script_patch.stdout"

    - name: Rebuild the ui image
      ansible.builtin.command:
        cmd: docker compose -f docker-compose.prod.yml build ui
        chdir: "{{ deploy_dir }}"
      register: build
      changed_when: true

    - name: Restart the ui service
      ansible.builtin.command:
        cmd: docker compose -f docker-compose.prod.yml up -d ui
        chdir: "{{ deploy_dir }}"
      register: up
      changed_when: "'Started' in up.stderr or 'Recreated' in up.stderr"

    # Body-aware, from the box itself (bypasses Cloudflare via --resolve): the container may take a
    # few seconds to come back after the recreate.
    - name: Smoke — msgboard.xyz serves 200 + a body
      ansible.builtin.command: >-
        docker run --rm --network host curlimages/curl:latest -sk -m 15
        --resolve msgboard.xyz:443:127.0.0.1 https://msgboard.xyz/ -o /dev/null -w '%{http_code}:%{size_download}'
      register: smoke
      changed_when: false
      retries: 8
      delay: 5
      until: smoke.stdout is match('^200:[1-9][0-9]*$')
      failed_when: smoke.stdout is not match('^200:[1-9][0-9]*$')

    - name: Smoke — public URL through Cloudflare
      ansible.builtin.command: curl -sS -m 15 -o /dev/null -w '%{http_code}:%{size_download}' https://msgboard.xyz/
      register: public_smoke
      changed_when: false
      failed_when: public_smoke.stdout is not match('^200:[1-9][0-9]*$')

    - name: Deployed
      ansible.builtin.debug:
        msg: "msgboard.xyz rebuilt + serving ({{ public_smoke.stdout }})"
