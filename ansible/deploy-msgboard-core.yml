---
# Deploy the core msgboard writers and the archivist: spam-{1,369,943,11155111}, bridge, indexer.
#
# WHY THIS PLAY EXISTS. Every other service on this box had a runbook; these did not, so they were
# never redeployed after the 2026-08-21 proof-of-work cutover. Their images date from 2026-06-08 and
# the source under /opt/msgboard/packages dates from 2026-07-17 — both pre-cutover. They kept grinding
# the old algorithm, the node rejected every post with `powmsg: invalid work`, and the containers
# reported `running`, exit 0, zero restarts the whole time. Chain 1's board went empty on 2026-08-21
# and stayed empty for 17 days before anyone noticed.
#
# A rebuild alone does NOT fix that. The box is a snapshot, not a checkout, so `docker compose build`
# would rebuild the same stale source. This play syncs the source first.
#
# WHAT IT DOES NOT TOUCH. /opt/msgboard/package.json is a deliberately PRUNED workspace list,
# maintained in place by deploy-msgboard-ui.yml — it drops the workspaces this box cannot build
# (games/contracts needs forge, packages/pow-grinder needs a wasm toolchain) and carries the
# @noble/curves override that keeps the lockfile-less `npm i` from floating into a broken 2.x.
# Overwriting it with the repo's copy breaks the image build. This play leaves it alone.
#
#   ansible-playbook deploy-msgboard-core.yml
#
# Roll back (each service keeps its previous image tagged :prev):
#   ssh root@88.99.62.98 -p 2222 'cd /opt/msgboard && for s in spam-1 spam-369 spam-943 bridge indexer; do
#     docker tag msgboard-$s:prev msgboard-$s:latest; done && docker compose -f docker-compose.prod.yml up -d'
- name: Deploy the msgboard writers + archivist (post-PoW-cutover source, adds Sepolia)
  hosts: msgboard
  gather_facts: false
  vars:
    deploy_dir: /opt/msgboard
    repo_root: "{{ playbook_dir }}/.."
    # Only the workspaces these six containers actually run. Each is in the box's pruned
    # workspace list, so the synced source is what `npm i` links and the image builds.
    #   core + sdk  — the proof-of-work itself. THE stale pieces that caused `invalid work`.
    #   relayer     — the engine, plus the new heartbeat, redactor and Sepolia chain entry.
    #   sponsor     — spam.ts / bridge.ts.
    #   indexer     — the archivist entrypoint.
    #   history     — the archive schema the indexer writes through.
    sync_packages: [core, sdk, relayer, sponsor, indexer, history]
    # The services this play owns. `sponsor` and `ui` build from the same source but are
    # deployed by their own plays; rebuilding them here would widen the blast radius.
    core_services: [spam-1, spam-369, spam-943, spam-11155111, bridge, indexer]
    # Chains that MUST be carrying messages when this play finishes. A writer that
    # reports healthy while its board stays empty is the exact failure this play exists
    # to catch, so these gate the run.
    writer_chains: ['1', '369', '943']
    # Chains whose writer is deployed but cannot post yet for a reason outside this repo.
    # Reported loudly, never gating — a deploy that fixed three boards must not be marked
    # failed by a fourth that needs someone else to act.
    #
    # 11155111 (Sepolia): CAUSE FOUND 2026-09-08 — a reth build split, not routing and not
    # this box's key. The two Sepolia replicas run different builds with identical --http.api:
    #
    #   direct-a-evm-11155111   build f3e90f0   serves msgboard_*
    #   direct-b-evm-11155111   build 893a593   answers -32601
    #
    # Until 893a593 the msgboard module was installed with `merge_configured`, which merges into
    # every transport with no namespace check, so msgboard_* answered regardless of the allowlist.
    # 893a593 changed it to `merge_if_module_configured`, which respects --http.api. Neither box
    # declares msgboard, so the newer build correctly stops serving it and the older one keeps
    # leaking it. Callers hash to different homes, so vk_demo reaches the leaking replica and this
    # box reaches the correct one — same endpoint, same minute, opposite answers.
    #
    # There is no config-level fix on 893a593: adding `msgboard` to --http.api makes reth refuse to
    # start ("Unknown RPC module: 'msgboard'"), so the namespace has to become declarable in reth
    # first. Until then, every replica that rolls to 893a593 loses msgboard.
    #
    # Nothing changes in this repo. This writer and the archivist resume with no redeploy once the
    # replicas serve msgboard again; move the id into writer_chains when the heartbeat shows a row.
    pending_chains: ['11155111']
    src_tarball: /tmp/msgboard-core-src.tgz

  tasks:
    - name: Refuse to run against a box whose package.json we would break
      ansible.builtin.command: grep -q '"packages/sponsor"' {{ deploy_dir }}/package.json
      changed_when: false

    # ---------------------------------------------------------------- sync the source

    - name: Pack the writer source (excluding build output and installed modules)
      ansible.builtin.command:
        cmd: >-
          tar --exclude=node_modules --exclude=dist --exclude=.turbo --exclude='*.tsbuildinfo'
          -czf {{ src_tarball }} Dockerfile docker-compose.prod.yml
          {{ sync_packages | map('regex_replace', '^', 'packages/') | join(' ') }}
        chdir: "{{ repo_root }}"
      delegate_to: localhost
      changed_when: true

    - name: Ship and unpack it over the box snapshot
      ansible.builtin.unarchive:
        src: "{{ src_tarball }}"
        dest: "{{ deploy_dir }}"
        mode: "0644"
      register: src_sync

    - name: Confirm the synced source is post-cutover
      ansible.builtin.command: >-
        grep -q 'sepolia' {{ deploy_dir }}/packages/relayer/src/chains.ts
      changed_when: false

    # The box builds with NO lockfile, so `npm i` floats every transitive to whatever is newest
    # that day, and a green local build proves nothing about this machine. Pin the versions we
    # actually test against. This dict is duplicated in deploy-msgboard-ui.yml on purpose — either
    # play may run first, and both must leave the box on the same versions. Keep them identical.
    - name: Pin floating transitives the box would otherwise resolve fresh
      ansible.builtin.shell: |
        cd {{ deploy_dir }}
        python3 - <<'PY'
        import json
        p = json.load(open('package.json'))
        ov = p.setdefault('overrides', {})
        want = {'@noble/curves': '^1.9.7', '@types/node': '22.15.2', 'typescript': '5.8.3'}
        add = {k: v for k, v in want.items() if ov.get(k) != v}
        if add:
            ov.update(add)
            json.dump(p, open('package.json', 'w'), indent=2)
            open('package.json', 'a').write('\n')
            print('PINNED ' + ', '.join(add))
        PY
      register: override_patch
      changed_when: "'PINNED' in override_patch.stdout"

    # ---------------------------------------------------------------- Sepolia's endpoint

    - name: Is RPC_11155111 already set?
      ansible.builtin.command: grep -q '^RPC_11155111=' {{ deploy_dir }}/.env
      register: sepolia_set
      changed_when: false
      failed_when: false

    # Derive it from the RPC_1 line already in .env — same gateway, same key, different chain id —
    # then PROVE the derived URL reaches Sepolia before writing anything. Deriving blind would append
    # a broken line to .env on any endpoint whose path is not the one this sed assumes.
    # no_log throughout: these lines carry the real key.
    - name: Probe the derived Sepolia endpoint before writing it
      ansible.builtin.shell: |
        set -euo pipefail
        url=$(grep -m1 '^RPC_1=' {{ deploy_dir }}/.env | sed 's|^RPC_1=||; s|/evm/1$|/evm/11155111|')
        curl -s --max-time 20 -X POST "$url" -H 'content-type: application/json' \
          -d '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' \
          | grep -o '0xaa36a7' || echo MISMATCH
      args:
        executable: /bin/bash
      register: derived_probe
      changed_when: false
      no_log: true
      when: sepolia_set.rc != 0

    - name: The derived endpoint must actually be Sepolia
      ansible.builtin.assert:
        that: "'0xaa36a7' in derived_probe.stdout"
        fail_msg: >-
          Deriving RPC_11155111 from RPC_1 did not reach Sepolia (eth_chainId != 0xaa36a7).
          Set RPC_11155111 in {{ deploy_dir }}/.env by hand and rerun. Nothing was written.
        success_msg: "The derived endpoint answers eth_chainId 0xaa36a7 (Sepolia)."
      when: sepolia_set.rc != 0

    - name: Write RPC_11155111 into the box .env
      ansible.builtin.shell: |
        set -euo pipefail
        grep -m1 '^RPC_1=' {{ deploy_dir }}/.env \
          | sed 's|^RPC_1=|RPC_11155111=|; s|/evm/1$|/evm/11155111|' >> {{ deploy_dir }}/.env
      args:
        executable: /bin/bash
      no_log: true
      when: sepolia_set.rc != 0

    # INDEXER_CHAINS is unset in .env, so the compose default applies. That default now reads
    # 1,369,943,11155111 — no .env edit needed, and the chain list stays in version control.
    - name: Confirm the indexer will be told to watch Sepolia
      ansible.builtin.command: grep -q 'INDEXER_CHAINS:-1,369,943,11155111' {{ deploy_dir }}/docker-compose.prod.yml
      changed_when: false

    # ---------------------------------------------------------------- rebuild

    # Keep the running image under :prev so a rollback is a retag, not a rebuild from
    # whatever source happens to be on the box afterwards.
    - name: Tag each running image :prev for rollback
      ansible.builtin.shell: >-
        docker image inspect msgboard-{{ item }}:latest >/dev/null 2>&1
        && docker tag msgboard-{{ item }}:latest msgboard-{{ item }}:prev
        || echo "no current image for {{ item }} — nothing to roll back to"
      args:
        executable: /bin/bash
      loop: "{{ core_services }}"
      changed_when: true

    - name: Build and restart the writers and the archivist
      ansible.builtin.command:
        cmd: docker compose -f docker-compose.prod.yml up -d --build {{ core_services | join(' ') }}
        chdir: "{{ deploy_dir }}"
      register: up
      changed_when: true
      # A build pulls a base image and runs a full `npm i` for six services.
      async: 2400
      poll: 15

    - name: Every service is running
      ansible.builtin.shell: >-
        docker inspect -f '{{ '{{' }}.State.Status{{ '}}' }}' {{ core_services | join(' ') }}
      args:
        executable: /bin/bash
      register: states
      changed_when: false
      failed_when: states.stdout_lines | reject('equalto', 'running') | list | length > 0

    # ---------------------------------------------------------------- prove it actually works

    - name: Give the grinders time to land a first post
      ansible.builtin.pause:
        seconds: 180

    # The failure this play exists to fix. A writer that reports `running` while every post is
    # rejected looks identical to a healthy one, so assert on the rejection itself.
    - name: No writer is being rejected for stale proof of work
      ansible.builtin.shell: >-
        docker logs --since 10m {{ item }} 2>&1 | grep -c 'invalid work' || true
      args:
        executable: /bin/bash
      loop: "{{ core_services }}"
      register: pow_rejects
      changed_when: false
      failed_when: pow_rejects.stdout | trim | int > 0

    # Prove the writers are landing posts, by asking the archivist what it can SEE.
    #
    # The obvious check — read msgboard_status through the public vk_demo endpoint — is
    # wrong here, and it failed a healthy deploy before this replaced it. Callers are pinned
    # to a home upstream per key, so two keys read two different replicas. On 2026-09-08 the
    # box's key saw 29-34 messages on chain 1 while vk_demo reported 0, eight consecutive
    # samples, same head block. BOTH answers were successful results, not errors, so chain 1
    # is genuinely two boards with different contents — a separate open problem from the
    # Sepolia build split below, which returns -32601 rather than an empty board. Confirmed
    # separate: reth read both chain-1 replicas off /proc/<pid>/exe and both run f3e90f079f,
    # the build that still serves msgboard on every transport. Neither is on 893a593, so the
    # split cannot produce a 29-versus-0 board there. Nobody owns chain 1 yet. Either way,
    # reading a board through a key the writer does not use proves nothing about the writer.
    #
    # The heartbeat reads through the box's own key, on the same node the writers post
    # to, so `polled > 0` means those posts are real and visible. It is also the check
    # that would have caught the original 17-day outage on day one.
    - name: Wait until every chain we must serve has a fresh, non-empty heartbeat
      ansible.builtin.shell: >-
        docker exec msgboard-postgres psql -U msgboard-postgres -d msgboard-postgres -tAc
        "SELECT count(*) FROM indexer_heartbeat
         WHERE chain_id IN ({{ writer_chains | join(',') }})
           AND polled > 0
           AND last_tick_at    > now() - interval '5 minutes'
           AND last_message_at > now() - interval '15 minutes'"
      args:
        executable: /bin/bash
      register: healthy
      changed_when: false
      retries: 12
      delay: 20
      until: (healthy.stdout | trim | int) == (writer_chains | length)
      failed_when: (healthy.stdout | trim | int) != (writer_chains | length)

    - name: Heartbeat table (chain | polled | recorded | secs since tick | secs since message)
      ansible.builtin.shell: >-
        docker exec msgboard-postgres psql -U msgboard-postgres -d msgboard-postgres -tAc
        "SELECT chain_id, polled, recorded,
                extract(epoch from now() - last_tick_at)::int,
                coalesce(extract(epoch from now() - last_message_at)::int, -1)
         FROM indexer_heartbeat ORDER BY chain_id"
      args:
        executable: /bin/bash
      register: heartbeat
      changed_when: false

    - name: Heartbeat
      ansible.builtin.debug:
        msg: "{{ heartbeat.stdout_lines }}"

    # Not an assertion. A pending chain is expected to be empty; printing where it stands
    # keeps it visible so it does not quietly become permanent.
    - name: Report where each pending chain stands
      ansible.builtin.uri:
        url: "https://one.valve.city/rpc/vk_demo/evm/{{ item }}"
        method: POST
        body_format: json
        body: { jsonrpc: "2.0", id: 1, method: msgboard_status, params: [] }
        return_content: true
      delegate_to: localhost
      loop: "{{ pending_chains }}"
      register: pending
      changed_when: false
      failed_when: false

    - name: Pending chains
      ansible.builtin.debug:
        msg: >-
          chain {{ item.item }}: board holds
          {{ item.json.result.count | int(base=16) if item.json is defined else 'unknown' }} message(s).
          Its writer is deployed and grinding; it starts landing posts as soon as the gateway
          exposes the msgboard methods to this box's key on that chain.
      loop: "{{ pending.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: The noop log burst is gone
      ansible.builtin.shell: >-
        echo "observe-noop lines in the last 5m: $(docker logs --since 5m indexer 2>&1 | grep -c 'observe: noop' || true)"
      args:
        executable: /bin/bash
      register: noop_count
      changed_when: false
      failed_when: (noop_count.stdout | regex_search('[0-9]+$') | int) > 0

    - name: Result
      ansible.builtin.debug:
        msg: >-
          {{ core_services | join(', ') }} rebuilt from post-cutover source and running.
          {{ noop_count.stdout }}. Roll back with the retag command in this play's header.
